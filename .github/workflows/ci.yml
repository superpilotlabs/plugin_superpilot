name: ci

# Only one instance of this workflow may run at a time.
concurrency:
  group: ${{ github.workflow }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format
      - run: pnpm run lint
      - run: pnpm run deploy:ci
        env:
          SFCC_SERVER: ${{ vars.B2C_HOSTNAME }}
          SFCC_CLIENT_ID: ${{ secrets.SFCC_CLIENT_ID }}
          SFCC_CLIENT_SECRET: ${{ secrets.SFCC_CLIENT_SECRET }}
          SFCC_CODE_VERSION: ${{ vars.SFCC_CODE_VERSION || 'v1' }}
      - run: pnpm test
        env:
          B2C_HOSTNAME: ${{ vars.B2C_HOSTNAME }}
          B2C_SITE_ID: ${{ vars.B2C_SITE_ID }}
          TEST_LANDING_SLUG: ${{ vars.TEST_LANDING_SLUG }}
